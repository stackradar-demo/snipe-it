name: StackRadar Demo CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stackradar-demo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: StackRadar Demo CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_CONNECTION: sqlite
      LOG_CHANNEL: single
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, fileinfo, gd, ldap, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: ${{ github.event_name == 'push' && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-interaction

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare SQLite application environment
        run: |
          cp .env.testing.example .env
          cp .env.testing.example .env.testing
          touch database/database.sqlite
          php artisan key:generate
          php artisan passport:keys

      - name: Run tests
        run: php artisan test

      - name: Collect reusable focused baseline coverage
        if: github.event_name == 'push'
        env:
          XDEBUG_MODE: coverage
        run: >-
          php -d memory_limit=-1 vendor/bin/phpunit
          tests/Feature/Settings/ShowSetUpPageTest.php
          tests/Feature/Livewire/SlackSettingsFormAuthorizationTest.php
          --coverage-filter vendor/guzzlehttp/guzzle
          --coverage-php=/tmp/stackradar-coverage.php

      - name: Export dependency coverage index
        if: github.event_name == 'push'
        run: |
          php .github/stackradar/export-baseline-coverage.php \
            vendor/autoload.php \
            /tmp/stackradar-coverage.php \
            '${{ github.repository }}' \
            '${{ github.sha }}' \
            '${{ github.run_id }}' \
            guzzlehttp/guzzle \
            /tmp/stackradar-baseline-coverage

      - name: Upload reusable baseline coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: stackradar-baseline-coverage
          path: /tmp/stackradar-baseline-coverage/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Run PHPStan
        run: composer analyse:phpstan

      - name: Run PHPMD
        run: composer analyse:phpmd
